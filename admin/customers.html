<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers | KAPE Admin</title><link rel="stylesheet" href="css/admin.css"><script src="../frontend/js/config.js" defer></script><script src="../frontend/js/api.js" defer></script><script src="js/common.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',async()=>{try{const rows=await adminRequest('/admin/customers');document.querySelector('[data-rows]').innerHTML=rows.map(x=>`<tr><td>${escAdmin(x.name)}</td><td>${escAdmin(x.email)}</td><td>${escAdmin(x.phone||'')}</td><td>${escAdmin(x.created_at)}</td></tr>`).join('');}catch(e){showError(e);}});</script></head><body><header class="site-header" data-admin-header></header><div class="admin-shell"><aside class="sidebar" data-admin-sidebar aria-label="Admin workspace navigation"></aside><main class="admin-content"><h1>Customers</h1><p class="notice error" data-error hidden></p><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead><tbody data-rows></tbody></table></div></main></div></body></html>
