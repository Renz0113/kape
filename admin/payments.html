<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | KAPE Admin</title><link rel="stylesheet" href="css/admin.css"><script src="../frontend/js/config.js" defer></script><script src="../frontend/js/api.js" defer></script><script src="js/common.js" defer></script><script defer>
document.addEventListener('DOMContentLoaded',async()=>{try{const rows=await adminRequest('/admin/payments');document.querySelector('[data-rows]').innerHTML=rows.length?rows.map(x=>`<tr><td>${escAdmin(x.order_id)}</td><td>${escAdmin(x.provider)}</td><td>${escAdmin(x.provider_reference||'—')}</td><td>${KapeConfig.formatMoney(x.amount)}</td><td>${escAdmin(x.status)}</td></tr>`).join(''):'<tr><td colspan="5">No payment records. Payment processing is not configured.</td></tr>';}catch(e){showError(e);}});
</script></head><body><header class="site-header" data-admin-header></header><div class="admin-shell"><aside class="sidebar" data-admin-sidebar aria-label="Admin workspace navigation"></aside><main class="admin-content"><h1>Payments</h1><p>Provider integration is currently disabled.</p><p class="notice error" data-error hidden></p><table><thead><tr><th>Order</th><th>Provider</th><th>Reference</th><th>Amount</th><th>Status</th></tr></thead><tbody data-rows></tbody></table></main></div></body></html>
