<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin users | KAPE</title><link rel="stylesheet" href="css/admin.css"><script src="../frontend/js/config.js" defer></script><script src="../frontend/js/api.js" defer></script><script src="js/common.js" defer></script><script src="js/users.js" defer></script></head>
<body>
  <header class="site-header" data-admin-header></header>
  <div class="admin-shell">
    <aside class="sidebar" data-admin-sidebar aria-label="Admin workspace navigation"></aside>
    <main class="admin-content">
      <h1>Admin users</h1>
      <p>Create accounts for teammates who need access to the KAPE admin area. New admins can sign in at <a href="login.html">Admin login</a>.</p>
      <p class="notice error" data-error hidden></p>
      <p class="notice" data-success hidden></p>
      <form class="form panel" data-admin-form>
        <h2>Create an admin</h2>
        <label>Name<input name="name" maxlength="120" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
        <p class="muted">Use at least 10 characters. The password is stored as a secure hash.</p>
        <button class="button">Create admin account</button>
      </form>
      <h2>Existing admins</h2>
      <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Created</th></tr></thead><tbody data-admin-rows><tr><td colspan="3">Loading administrators…</td></tr></tbody></table></div>
    </main>
  </div>
</body>
</html>
