<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Products | KAPE Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
    <script src="../frontend/js/config.js" defer></script><script src="../frontend/js/api.js" defer></script><script src="js/common.js" defer></script>
    <script src="js/products.js" defer></script>
  </head>
  <body>
    <header class="site-header" data-admin-header></header>
    <div class="admin-shell">
      <aside class="sidebar" data-admin-sidebar aria-label="Admin workspace navigation"></aside>
      <main class="admin-content">
        <h1>Products</h1>
        <p class="notice error" data-error hidden></p>
        <h2 data-product-form-title>Add Product</h2>
        <form class="form panel" data-product-form>
          <input type="hidden" name="id" /><label
            >Name<input name="name" required maxlength="160" /></label
          ><label
            >Slug<input
              name="slug"
              required
              pattern="[a-z0-9]+(-[a-z0-9]+)*" /></label
          ><label>Category<select name="category_id"></select></label
          ><label>Description<textarea name="description"></textarea></label
          ><label
            >Price<input
              name="price"
              type="number"
              min="0"
              step="0.01"
              required /></label
          ><label
            >Stock<input
              name="stock_quantity"
              type="number"
              min="0"
              required /><small class="product-stock-help">Stock changes made here are recorded in inventory activity.</small></label
          ><section class="product-image-field" aria-labelledby="product-image-label">
            <h3 id="product-image-label">Product Image</h3>
            <div class="product-image-preview" data-image-preview-box>
              <img data-image-preview alt="Product image preview" hidden />
              <span data-image-placeholder>No image selected</span>
            </div>
            <input
              class="product-image-input"
              id="product-image"
              type="file"
              name="image"
              accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
              data-image-input
            />
            <div class="product-image-actions">
              <label class="button secondary" for="product-image">Choose Image</label>
              <button class="button secondary" type="button" data-remove-image>Remove Image</button>
            </div>
            <p class="product-image-help">JPG, JPEG, PNG, or WEBP. Maximum file size: 5 MB.</p>
            <p class="product-image-message" data-image-message role="status" aria-live="polite" hidden></p>
            <input type="hidden" name="image_action" value="keep" data-image-action />
          </section>
          <div>
            <button class="button">Save product</button>
            <button type="reset" class="button secondary">Clear</button>
          </div>
        </form>
        <h2>Catalog</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Product</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Availability</th>
                <th></th>
              </tr>
            </thead>
            <tbody data-rows></tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
