<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drink details | KAPE.</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/storefront.css"><script src="js/config.js" defer></script><script src="js/api.js" defer></script><script src="js/cart.js" defer></script><script defer>
document.addEventListener('DOMContentLoaded',async()=>{const root=document.querySelector('[data-product]');const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Choose a drink from the menu to see its details.');const product=await KapeAPI.request(`/products/${encodeURIComponent(id)}`),available=Number(product.available)>0;root.innerHTML=`<article class="product-detail${available?'':' is-sold-out-card'}"><div class="product-detail-image"><img src="${esc(product.image_path||'../macha1.jpg')}" alt="${esc(product.name)}">${available?'':'<span class="stock-badge is-sold-out">Sold out</span>'}</div><div class="product-detail-copy"><p class="eyebrow">${esc(product.category_name||'KAPE')}</p><h1>${esc(product.name)}</h1><p class="product-description">${esc(product.description||'Made fresh for your day.')}</p><p class="price">${KapeConfig.formatMoney(product.price)}</p><label class="quantity-label" for="product-quantity">Quantity<input class="quantity" id="product-quantity" type="number" min="1" max="50" value="1" data-qty ${available?'':'disabled'}></label><div class="product-actions"><button class="button" type="button" data-add ${available?'':'disabled'}>${available?'Add to cart':'Sold out'} <span aria-hidden="true">↗</span></button><a class="button secondary" href="menu.html">Back to menu</a></div><p class="availability-note" data-cart-feedback aria-live="polite">${available?'Prepared fresh when you order.':'This drink is temporarily unavailable.'}</p></div></article>`;root.querySelector('[data-add]')?.addEventListener('click',()=>{KapeCart.add(product.id,root.querySelector('[data-qty]').value,product.name);root.querySelector('[data-cart-feedback]').textContent=`${product.name} added to your cart.`;});}catch(error){root.innerHTML=`<section class="empty-cart"><h2>We couldn’t find that drink.</h2><p>${esc(error.message)}</p><a class="button" href="menu.html">Back to the menu <span aria-hidden="true">↗</span></a></section>`;}});
</script></head><body><header class="site-header"><a class="brand" href="home.html">KAPE<span>.</span></a><nav><a href="menu.html">Menu</a><a href="me.html">Me</a><a href="cart.html">Cart</a></nav></header><main class="page-shell"><div data-product><p class="muted">Finding your drink…</p></div></main></body></html>
